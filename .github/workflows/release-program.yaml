name: Release Program to Mainnet

env:
  SOLANA_CLI_VERSION: 4.3.2
  NODE_VERSION: 18.12.1

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "program-*" # Push events to matching program-*, i.e. program-circuit-breaker-0.0.1

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-programs
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - uses: actions/cache@v4
        name: Cache Toml Cli
        id: cache-toml-cli
        with:
          path: |
            ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}-v0002
      # `--locked` builds against the crate's own lockfile. This step runs in `solana-programs`,
      # so it takes that directory's pinned toolchain, and re-resolving picks up dependencies
      # that require a newer rustc than the pin. A failure here is fatal: the next step reads
      # the program id with this binary, and an empty id reaches `anchor idl write-buffer`
      # several steps later as a missing argument.
      - run: cargo install toml-cli --locked
        if: steps.cache-toml-cli.outputs.cache-hit != 'true'
        shell: bash

      - name: Set tag information
        run: |
          TAG=${GITHUB_REF#refs/tags/}  # Extract tag name from ref
          echo "Tag name: $TAG"
          PROGRAM=$(echo $TAG | sed 's/program-\(.*\)-[0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}/\1/')
          VERSION=$(echo $TAG | sed 's/.*-\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)$/\1/')
          PROGRAM_NAME=${PROGRAM//-/_}  # Substitute dashes with underscores
          PROGRAM_ID=$(~/.cargo/bin/toml get Anchor.toml programs.localnet.${PROGRAM_NAME} | tr -d '"')

          # An id is what every step below addresses the program by, and an empty one is accepted
          # until `anchor idl write-buffer` rejects it as a missing argument, nine minutes and four
          # steps away from the tag that named no program Anchor.toml holds.
          if [ -z "$PROGRAM_ID" ]; then
            echo "::error::no program id for '${PROGRAM_NAME}' in Anchor.toml programs.localnet (tag ${TAG})"
            exit 1
          fi

          echo "Program: $PROGRAM"
          echo "Program: $PROGRAM_ID"
          echo "Version: $VERSION"
          echo "PROGRAM_ID=${PROGRAM_ID}" >> $GITHUB_ENV
          echo "PROGRAM_NAME=${PROGRAM_NAME}" >> $GITHUB_ENV

      # Build the program with anchor so we get the IDL
      - uses: ./.github/actions/build-anchor/
        id: build-anchor
        with:
          testing: false
          devnet: false
          program: ${{ env.PROGRAM_NAME }}

      - name: Push IDL to Github
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/idl/${{ env.PROGRAM_NAME }}.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-verified/
        id: build-verified
        with:
          program: ${{ env.PROGRAM_NAME }}
          program-id: ${{ env.PROGRAM_ID }}

      # Once SIMD-0500 activates, the cluster rejects new deploys of SBPF v0-v2 ELFs. This checks
      # the ELF the next step uploads, after build-verified replaced it. It fails only when the
      # gate is active and the ELF is not v3. A pending or unknown gate with a non-v3 ELF only
      # warns. A v3 ELF passes in every gate state. It also prints the SIMD-0433 gate, for
      # information only: buffer-deploy extends the programdata whatever that gate's state.
      - name: Check SBPF version against the deploy gate
        shell: bash
        env:
          RPC_URL: ${{ secrets.SOLANA_DEPLOY_URL }}
          GATE: B8JJXCy5amZyWG9r7EnUYLwzXSXTxG7GZ1qZ1qggo83g
          RESIZE_GATE: EhisBfVtGvEA8bVCVN5VMaYEaX6iTfoUrmcDi8LY7Kxy
        run: |
          set -euo pipefail
          ELF="target/deploy/${PROGRAM_NAME}.so"
          # e_flags is the u32 at offset 0x30 of an ELF64 little-endian header. SBPF v3 is 3.
          E_FLAGS=$(od -An -tu4 -j48 -N4 "$ELF" | tr -d ' ')
          echo "${ELF}: e_flags ${E_FLAGS}"

          # A feature account that does not exist is a gate nobody has proposed yet. Byte 0 of
          # its data is 1 once the feature has activated, and 0 while it waits for the next epoch.
          gate_state() {
            local RESPONSE
            if ! RESPONSE=$(curl -sSf --max-time 30 -X POST -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$1\",{\"encoding\":\"base64\"}]}" \
              "$RPC_URL"); then
              echo unknown
              return
            fi
            # An RPC error body has no `result`, so it stays unknown.
            echo "$RESPONSE" | jq -r '
              if (.result | type) != "object" then "unknown"
              elif .result.value == null then "unallocated"
              elif (.result.value.data[0] | @base64d | explode[0]) == 1 then "active"
              else "pending" end' || echo unknown
          }
          GATE_STATE=$(gate_state "$GATE")
          echo "SIMD-0500 gate ${GATE}: ${GATE_STATE}"
          echo "SIMD-0433 gate ${RESIZE_GATE}: $(gate_state "$RESIZE_GATE")"

          if [ "$E_FLAGS" != "3" ]; then
            MESSAGE="${PROGRAM_NAME}.so is not SBPF v3 (e_flags ${E_FLAGS}) and the deploy gate is ${GATE_STATE}"
            if [ "$GATE_STATE" = "active" ]; then
              echo "::error::${MESSAGE}"
              exit 1
            elif [ "$GATE_STATE" != "unallocated" ]; then
              echo "::warning::${MESSAGE}"
            fi
          fi

      - uses: ./.github/actions/buffer-deploy/
        id: buffer-deploy
        with:
          network: ${{ secrets.SOLANA_DEPLOY_URL }}
          program: ${{ env.PROGRAM_NAME }}
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer-authority: ${{ secrets.MULTISIG_VAULT }}

      - name: Squads program upgrade
        uses: helium/squads-program-upgrade@v0.5.0
        with:
          network-url: "https://api.mainnet-beta.solana.com"
          program-multisig: ${{ secrets.MULTISIG }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.buffer-deploy.outputs.buffer }}
          idl-buffer: ${{ steps.buffer-deploy.outputs.idl-buffer }}
          spill-address: ${{ secrets.DEPLOYER_ADDRESS }}
          authority: ${{ secrets.MULTISIG_VAULT }}
          name: "Deploy ${{env.PROGRAM_NAME}} ${{env.VERSION}}"
          keypair: ${{ secrets.DEPLOYER_KEYPAIR }}
