name: "Setup Anchor"
description: "Setup Anchor"
inputs:
  devnet:
    description: "Whether to use devnet feature"
    required: false
    default: "false"
  testing:
    description: "Whether to use devnet feature"
    required: false
    default: "false"
  program:
    description: "The program to build"
    required: false
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup/
    - uses: ./.github/actions/setup-anchor/
      with:
        node-version: ${{ env.NODE_VERSION }}
    - uses: actions/cache@v4
      name: Cache Cargo registry + index
      id: cache-cargo-registry
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache Anchor Build
      uses: actions/cache@v4
      id: cache-anchor-build
      with:
        path: |
          ./solana-programs/target/
        key: build-${{ runner.os }}-${{env.ANCHOR_VERSION}}-${{env.ANCHOR_SHA}}-solana-${{ env.SOLANA_CLI_VERSION }}-sbpf-v3-v0003-${{ inputs.devnet }}-${{ inputs.testing }}-${{ hashFiles('./solana-programs/programs/**/**') }}-${{ inputs.program }}
    # `--arch v3` is explicit: cargo-build-sbf's default arch differs between agave releases, and
    # the release ELF must be SBPF v3. `anchor build` hands its cargo args to the IDL's
    # `cargo test` too, which rejects `--arch`, so the SBF build skips the IDL and
    # `anchor idl build` writes it per program.
    - run: |
        set -euo pipefail
        FEATURES=()
        if [ "$DEVNET" = "true" ]; then FEATURES=(--features devnet); fi
        if [ "$TESTING_BUILD" = "true" ]; then export TESTING=true; fi
        if [ -n "$PROGRAM" ]; then
          ~/.cargo/bin/anchor build --no-idl -p "$PROGRAM" -- --arch v3 "${FEATURES[@]}"
          PROGRAMS=("$PROGRAM")
        else
          ~/.cargo/bin/anchor build --no-idl -- --arch v3 "${FEATURES[@]}"
          mapfile -t PROGRAMS < <(~/.cargo/bin/anchor keys list | cut -d: -f1)
        fi
        mkdir -p target/idl target/types
        for P in "${PROGRAMS[@]}"; do
          ~/.cargo/bin/anchor idl build -p "$P" -o "target/idl/$P.json" -t "target/types/$P.ts" -- "${FEATURES[@]}"
        done
      if: steps.cache-anchor-build.outputs.cache-hit != 'true'
      shell: bash
      working-directory: solana-programs
      env:
        DEVNET: ${{ inputs.devnet }}
        TESTING_BUILD: ${{ inputs.testing }}
        PROGRAM: ${{ inputs.program }}
