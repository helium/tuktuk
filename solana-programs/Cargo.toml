[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-zk-sdk = "2.2.3"

# The anchor/solana program macros emit these cfgs, so declare them as expected.
# Otherwise Rust's check-cfg flags them and clippy -D warnings fails CI.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }
# solana-verify picks its build image from this version. Without it, it falls back to the
# solana-program version in Cargo.lock (2.2.1), whose image cannot build SBPF v3. 4.3.0 is the
# newest image solana-verify 0.5.2 ships.
[workspace.metadata.cli]
solana = "4.3.0"
